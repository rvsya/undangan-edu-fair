<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Blast Undangan - Edu Fair 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .control-group {
            flex: 1;
            min-width: 250px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
        }

        .btn-wa {
            display: inline-block;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-wa:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>

<body>

    <div class="panel">
        <h1>Panel Admin - WhatsApp Blast Undangan</h1>
        <p>Upload file <strong>data-tamu.csv</strong> untuk men-generate tautan undangan personal secara otomatis.</p>

        <div class="controls">
            <div class="control-group">
                <label for="base-url">URL Dasar Halaman Undangan:</label>
                <input type="text" id="base-url" value="https://rvsya.github.io/undangan-edu-fair/">
            </div>
            <div class="control-group">
                <label for="csv-file">Pilih File CSV (data-tamu.csv):</label>
                <input type="file" id="csv-file" accept=".csv">
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Tamu</th>
                        <th>Instansi</th>
                        <th>Kategori</th>
                        <th>No. WhatsApp</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="guest-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #64748b;">Silakan pilih file CSV terlebih
                            dahulu...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Default URL halaman undangan di GitHub Pages
        const DEFAULT_URL = 'https://rvsya.github.io/undangan-edu-fair/';
        const baseUrlInput = document.getElementById('base-url');
        baseUrlInput.value = DEFAULT_URL;

        let parsedData = [];

        // Fungsi parse baris CSV yang mendukung tanda kutip (misal: "Dr. Rina, M.Pd.")
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Render tabel dan tombol WA
        function renderTable() {
            const tbody = document.getElementById('guest-table-body');
            let baseUrl = baseUrlInput.value.trim() || DEFAULT_URL;
            tbody.innerHTML = '';

            parsedData.forEach(tamu => {
                // Pastikan separator (? atau &) sesuai kondisi baseUrl
                const separator = baseUrl.includes('?') ? '&' : '?';
                // Buat URL personalisasi dengan encodeURIComponent agar spasi & karakter khusus aman
                const personalLink = `${baseUrl}${separator}to=${encodeURIComponent(tamu.nama)}&instansi=${encodeURIComponent(tamu.instansi)}&kategori=${encodeURIComponent(tamu.kategori)}`;

                // Template pesan WhatsApp
                const pesan = `Yth. *${tamu.nama}* (${tamu.instansi}),\n\nKami mengundang Bapak/Ibu untuk hadir dalam acara *Edu Fair & Career Day 2026*.\n\nInformasi lengkap & konfirmasi kehadiran (RSVP) dapat diakses melalui tautan undangan digital berikut:\n${personalLink}\n\nTerima kasih atas perhatian dan kehadirannya.`;

                const waUrl = `https://wa.me/${tamu.wa}?text=${encodeURIComponent(pesan)}`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${tamu.id}</td>
                    <td><strong>${tamu.nama}</strong></td>
                    <td>${tamu.instansi}</td>
                    <td>${tamu.kategori}</td>
                    <td>${tamu.wa}</td>
                    <td>
                        <a href="${waUrl}" target="_blank" class="btn-wa">Kirim Undangan WhatsApp</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Event listener saat file CSV dipilih
        document.getElementById('csv-file').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const text = event.target.result;
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');

                parsedData = [];
                // Mulai dari index 1 untuk melewati baris header (id,nama_tamu,...)
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (cols.length >= 5) {
                        parsedData.push({
                            id: cols[0],
                            nama: cols[1],
                            instansi: cols[2],
                            kategori: cols[3],
                            wa: cols[4]
                        });
                    }
                }
                renderTable();
            };
            reader.readAsText(file);
        });

        // Update link WA otomatis jika URL dasar diubah
        baseUrlInput.addEventListener('input', () => {
            if (parsedData.length > 0) renderTable();
        });
    </script>
</body>

</html>
